/apply plugin: 'com.android.application'

android {
    namespace 'com.ttwarmup'
    compileSdk 34

    defaultConfig {
        applicationId "com.ttwarmup"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
